<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best Bingo (B)overlay - Scribe</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="dist/admin.js"></script>
  </head>
  <body class="admin">
    <p id="login-note" hidden>Scribes only. <a href="/auth/login">Log in with Twitch</a></p>

    <main id="scribe-ui" hidden>
    <section class="controls">
      <label>Board name <input id="game-name-input" type="text" autocomplete="off" /></label>
      <label>Board size <select id="size"></select></label>
      <a href="video_overlay.html">Player view</a>
    </section>

    <section class="controls">
      <label>Center space <input id="center-space" type="text" autocomplete="off" /></label>
      <label><input id="center-is-free" type="checkbox" /> Free space (marked from the start)</label>
    </section>

    <section class="controls">
      <label>Free space cost <input id="free-space-cost" type="number" min="0" /></label>
      <label>Free spaces per round <input id="free-space-limit" type="number" min="0" /></label>
    </section>
    <p>The cost is only shown to players. What they actually pay is set on the Twitch reward.</p>

    <details>
      <summary>Edit spaces (one per line)</summary>
      <textarea id="spaces" rows="10" spellcheck="false"></textarea>
    </details>

    <section class="controls">
      <button id="save-config" type="button">Save board settings</button>
      <button id="new-round" type="button">Start new round</button>
    </section>

    <section class="controls">
      <label>Add Scribe (Twitch username) <input id="scribe-name" type="text" autocomplete="off" /></label>
      <button id="add-scribe" type="button">Add</button>
    </section>

    <p id="round-info" class="game-name"></p>

    <p id="admin-message"></p>
    <section class="scores">
      <h2>Scoreboard <button id="reset-scores" type="button">Reset</button></h2>
      <ol id="scoreboard"></ol>
    </section>

    <section class="call-sheet">
      <h2>Call sheet (click to toggle called) <button id="call-all" type="button">Call all (debug)</button></h2>
      <div id="call-list" class="call-list"></div>
    </section>
    </main>
  </body>
</html>
