<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best Bingo (B)overlay</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="backend-config.js"></script>
    <script type="module" src="dist/main.js"></script>
  </head>
  <body>
    <aside class="left-panel panel">
      <h2>Leaderboard</h2>
      <ol id="scoreboard"></ol>
    </aside>

    <main class="center-panel">
      <section class="controls">
        <label id="player-name-label">Your name <input id="player-name" type="text" autocomplete="off" /></label>
        <button id="join" type="button">Join</button>
        <a id="admin-link" href="admin.html">Admin view</a>
      </section>

      <button id="call-bingo" type="button">Call Bingo</button>
      <p id="game-name" class="game-name"></p>
      <p id="message" class="error" role="alert"></p>
      <div id="banner" class="banner" hidden></div>

      <div id="board" class="board" aria-label="Bingo board"></div>

      <section class="called panel">
        <h2>Called spaces</h2>
        <ol id="called-list"></ol>
      </section>
    </main>

    <aside class="right-panel panel">
      <h2>Abilities</h2>
      <button id="free-space" type="button"></button>
      <p id="free-space-left"></p>

      <div id="free-space-form" hidden>
        <p>Pick a space to be marked by everyone</p>
        <select id="free-space-pick"></select>
        <div class="controls">
          <button id="free-space-submit" type="button">Submit</button>
          <button id="free-space-cancel" type="button">Cancel</button>
        </div>
      </div>
      <p id="free-space-message"></p>

      <button id="add-space" type="button"></button>
      <p id="add-space-left"></p>
      <div id="add-space-form" hidden>
        <p>Name a new space for the list</p>
        <input id="add-space-input" type="text" autocomplete="off" maxlength="32" />
        <div class="controls">
          <button id="add-space-submit" type="button">Submit</button>
          <button id="add-space-cancel" type="button">Cancel</button>
        </div>
      </div>
      <p id="add-space-message"></p>

      <button id="remove-space" type="button"></button>
      <p id="remove-space-left"></p>
      <div id="remove-space-form" hidden>
        <p>Pick a space to drop from the list</p>
        <select id="remove-space-pick"></select>
        <div class="controls">
          <button id="remove-space-submit" type="button">Submit</button>
          <button id="remove-space-cancel" type="button">Cancel</button>
        </div>
      </div>
      <p id="remove-space-message"></p>
    </aside>

    <div class="display-settings panel">
      <button id="mode-toggle" type="button">Mode: dark</button>
      <label>Opacity <input id="alpha-slider" type="range" min="0" max="100" value="85" /></label>
    </div>
  </body>
</html>
