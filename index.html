<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best Bingo (B)overlay</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="dist/main.js"></script>
  </head>
  <body>
    <section class="controls">
      <label>Your name <input id="player-name" type="text" autocomplete="off" /></label>
      <a href="admin.html">Admin view</a>
    </section>

    <p id="game-name" class="game-name"></p>
    <p id="message" class="error" role="alert"></p>
    <div id="banner" class="banner" hidden></div>

    <button id="call-bingo" type="button">Call Bingo</button>

    <main id="board" class="board" aria-label="Bingo board"></main>

    <section class="called">
      <h2>Called spaces</h2>
      <ol id="called-list"></ol>
    </section>
  </body>
</html>
